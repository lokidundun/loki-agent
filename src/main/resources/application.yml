spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
        options:
          max-tokens: 4096

  datasource:
    url: jdbc:sqlite:${user.home}/.loki-agent/loki-agent.db
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      class-loader: org.sqlite.JDBC

server:
  port: 0

loki:
  agent:
    workspace: ${user.home}/.loki-agent/workspace
    max-iterations: 10
    proactive:
      enabled: false
      daily-max: 5
      default-session: cli:console
    memory:
      consolidate-every: 5
      pending-threshold: 10
    telegram:
      enabled: false
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      bot-username: ${TELEGRAM_BOT_USERNAME:loki_agent_bot}
      allowed-users: ${TELEGRAM_ALLOWED_USERS:}

logging:
  level:
    com.loki.agent: DEBUG
